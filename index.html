<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="no-referrer" />
  <title>Colour Match Rush</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="pill"><small>SCORE</small><b id="score">0</b></div>
      <div class="pill"><small>COMBO</small><b id="combo">x1</b></div>
    </div>

    <div class="hero">
      <div class="prompt" id="prompt">MATCH THIS COLOUR!</div>
      <div class="ringWrap">
        <!-- 1 canvas does both: timer ring + target tile -->
        <canvas id="hud" width="360" height="360" aria-label="game hud"></canvas>
      </div>

      <div class="btnGrid" id="buttons"></div>

      <div class="actions">
        <button class="actionBtn primary" id="startBtn" type="button">PLAY</button>
        <button class="actionBtn" id="howBtn" type="button">HOW</button>
      </div>
    </div>

    <div class="footerRow">
      <div class="card">
        <h3>LEADERBOARD (LOCAL)</h3>
        <div id="leaderboard"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Game Over</h2>
      <div id="modalBody"></div>
      <p><span class="tag">Tap PLAY to try again</span></p>
      <div class="row">
        <button class="actionBtn primary" id="playAgainBtn" type="button">PLAY AGAIN</button>
        <button class="actionBtn" id="closeBtn" type="button">CLOSE</button>
      </div>
    </div>
  </div>

  <script src="leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
